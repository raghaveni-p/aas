<!DOCTYPE html>
<html>
<head>
    <title>RFID Attendance</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>RFID Attendance System</h1>

    <form method="POST">
        <input type="text" name="uid" placeholder="Scan RFID UID" required>
        <button type="submit">Mark Attendance</button>
    </form>

    <p class="msg">{{ message }}</p>

    <a href="/dashboard">View Attendance Dashboard</a>
</div>

</body>
</html>
